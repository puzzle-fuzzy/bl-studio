# create.yxswy.com —— bailian-studio 生产站点。
# 宿主机 nginx 边缘模板（与 dev/lunar/p2p 等子域名同一套运维）。
# 由 setup-host-edge.sh 在证书签发后写入 /etc/nginx/conf.d/；证书路径按 certbot 约定。

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name create.yxswy.com;

    # certbot webroot 校验目录（由 setup-host-edge.sh 创建）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bailian-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS proxy ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name create.yxswy.com;

    ssl_certificate     /etc/letsencrypt/live/create.yxswy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/create.yxswy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与 API multipart 120 MiB 上限一致，允许大文件上传。
    client_max_body_size 130m;

    # 反代到 web 容器（nginx 静态 + /api → api:5003），仅监听 127.0.0.1。
    location / {
        proxy_pass http://127.0.0.1:5002;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：关闭缓冲，长读超时。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
