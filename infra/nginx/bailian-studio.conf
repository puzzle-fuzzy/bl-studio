server {
  listen 5002;
  server_tokens off;
  # Canonical public host; `_` keeps the container usable behind an external
  # TLS terminator during rehearsal and does not replace certificate handling.
  server_name create.yxswy.com _;

  # Populated from apps/web/dist by the production Dockerfile.
  root /usr/share/nginx/html;
  index index.html;

  # Match the API's 120 MiB multipart ceiling. Nginx defaults to 1 MiB, which
  # would otherwise reject normal image/video uploads before they reach the
  # API's authenticated streaming body guards.
  client_max_body_size 120m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  # TLS/HSTS belongs to the public edge because this container may receive
  # plain HTTP from a trusted terminator. These headers are safe at both layers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

  # Docker service IPs can change when api is recreated. Resolve the service
  # name through Docker's embedded DNS at request time instead of freezing the
  # first container IP in nginx's startup-time upstream resolution.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bailian_studio_api http://api:5003;

  # Keep SSE open and unbuffered. The API still owns authentication and
  # authorization; nginx only forwards the same-origin browser request.
  location /api/ {
    proxy_pass $bailian_studio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 生产由 Caddy 把 X-Forwarded-For 覆盖为真实客户端 IP，这里用 $proxy_add_x_forwarded_for
    # 追加本层地址，API（API_TRUST_PROXY=true 时取首项做限流身份）拿到的首项即真实 IP。
    # rehearsal 为 nginx 直连且 API_TRUST_PROXY 未设（false，clientIdentity 固定
    # 'local-client'），不读取这些头，因此追加不会引入伪造风险。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    # 透传上游（Caddy 置 https）的 TLS 判定，避免用内部链路 $scheme=http 覆盖。
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Vite fingerprints production assets, so they are immutable for a year.
  # HTML routes remain revalidated so a release never strands an old shell.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # 管理后台（apps/admin，vite base /admin/）：同源 /admin 前缀服务。
  # 会话 cookie 与主站同源，登录/权限完全复用，无需新子域/证书/CORS。
  location = /admin { return 301 /admin/; }
  location /admin/ {
    alias /usr/share/nginx/html-admin/;
    try_files $uri $uri/ /admin/index.html;
  }
  # admin 产物的静态资源也带一年缓存。
  location /admin/assets/ {
    alias /usr/share/nginx/html-admin/assets/;
    try_files $uri =404;
    expires 1y;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
