name: bailian-studio-rehearsal

x-runtime-image: &runtime-image "bailian-studio-rehearsal-runtime:${BAILIAN_STUDIO_RELEASE_TAG:-local}"

# Local production-shaped rehearsal. It intentionally uses local storage and a
# throwaway Postgres volume, so it can validate startup, migrations, health
# checks, worker heartbeats, and same-origin nginx proxying without public
# credentials or an external deployment.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "55433:5432"
    environment:
      POSTGRES_USER: bailian-studio
      POSTGRES_PASSWORD: bailian-studio
      POSTGRES_DB: bailian-studio_rehearsal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bailian-studio -d bailian-studio_rehearsal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - rehearsal_postgres:/var/lib/postgresql/data

  migrate:
    image: *runtime-image
    environment:
      DATABASE_URL: postgres://bailian-studio:bailian-studio@postgres:5432/bailian-studio_rehearsal
    command: ["pnpm", "exec", "drizzle-kit", "migrate", "--config", "packages/db/drizzle.config.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  artifact-init:
    image: *runtime-image
    user: root
    entrypoint: ["/bin/sh", "-c"]
    # 运行时镜像以 bun 用户执行（Dockerfile 末尾 USER bun），产物目录须归属 bun；
    # 旧实现 chown node:node 在新基座上无 node 用户会失败。
    command: ["mkdir -p /app/var/artifacts/bailian-studio && chown -R bun:bun /app/var/artifacts"]
    volumes:
      - rehearsal_artifacts:/app/var/artifacts
    restart: "no"

  api:
    # Build the runtime once; migrate, artifact-init, Worker and ops-health all
    # consume this exact image rather than racing through duplicate builds.
    image: *runtime-image
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: runtime
      args:
        BAILIAN_STUDIO_RELEASE_TAG: "${BAILIAN_STUDIO_RELEASE_TAG:-local}"
    environment:
      NODE_ENV: rehearsal
      # 显式开启 JSON-lines，让演练路径覆盖生产日志格式（NODE_ENV=rehearsal 不会自动切）。
      LOG_FORMAT: json
      API_HOST: 0.0.0.0
      API_PORT: 5003
      DATABASE_URL: postgres://bailian-studio:bailian-studio@postgres:5432/bailian-studio_rehearsal
      AUTH_JWT_SECRET: rehearsal-only-secret-change-me-32-characters
      COOKIE_SECURE: "false"
      CSRF_REQUIRE_ORIGIN: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5012,http://127.0.0.1:5012
      API_RATE_LIMIT_ENABLED: "true"
      ARTIFACT_LOCAL_ROOT: /app/var/artifacts
      ARTIFACT_LOCAL_PUBLIC_BASE_URL: /api/artifacts/local
      GENERATION_DAILY_QUOTA_MODE: attempts
      MEDIA_MAX_DURATION_SECONDS: "1800"
      FFPROBE_PATH: ffprobe
      GENERATION_DAILY_TASK_LIMIT: "0"
      GENERATION_DAILY_COST_LIMIT_CENTS: "0"
    command: ["bun", "apps/api/src/index.ts"]
    ports:
      - "5013:5003"
    volumes:
      - rehearsal_artifacts:/app/var/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:5003/api/health/live').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    image: *runtime-image
    environment:
      NODE_ENV: rehearsal
      LOG_FORMAT: json
      DATABASE_URL: postgres://bailian-studio:bailian-studio@postgres:5432/bailian-studio_rehearsal
      DASHSCOPE_API_KEY: rehearsal-placeholder-not-a-secret
      BAILIAN_CONTRACT_LOCALE: zh-CN
      WORKER_ID: rehearsal-worker-1
      FFMPEG_PATH: ffmpeg
      ARTIFACT_LOCAL_ROOT: /app/var/artifacts
    command: ["pnpm", "exec", "tsx", "apps/worker/src/index.ts"]
    volumes:
      - rehearsal_artifacts:/app/var/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ops-health:
    profiles: ["ops"]
    image: *runtime-image
    environment:
      DATABASE_URL: postgres://bailian-studio:bailian-studio@postgres:5432/bailian-studio_rehearsal
    command: ["pnpm", "exec", "tsx", "infra/scripts/queue-ops.ts", "health"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    # Exercise the same apps/web + Nginx image used by production.
    image: "bailian-studio-rehearsal-web:${BAILIAN_STUDIO_RELEASE_TAG:-local}"
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        BAILIAN_STUDIO_RELEASE_TAG: "${BAILIAN_STUDIO_RELEASE_TAG:-local}"
        VITE_API_ORIGIN: ""
        VITE_WEB_ORIGIN: http://localhost:5012
    ports:
      - "5012:5002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rehearsal_postgres:
  rehearsal_artifacts:
