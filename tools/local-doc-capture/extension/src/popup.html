<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bailian Studio 采集</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #172033;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0 0 12px;
        color: #667085;
        font-size: 12px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        background: #1f5eff;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      button.secondary {
        margin-top: 8px;
        background: #667085;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0 8px;
        color: #475467;
        font-size: 12px;
      }

      input {
        width: 72px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        padding: 5px 6px;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Bailian Studio</h1>
    <p>
      只处理百炼公开文档。批量模式按最新官方登记表逐页处理，并跳过 Token Plan、
      套餐、计费和价格类页面。
    </p>
    <button id="capture" type="button">采集当前页面</button>
    <label for="max-pages">
      批量最多保存有效页数
      <input id="max-pages" type="number" min="1" max="500" value="300" />
    </label>
    <button id="start-batch" type="button">开始批量采集</button>
    <button id="stop-batch" class="secondary" type="button" disabled>
      停止批量采集
    </button>
    <button id="resume-batch" class="secondary" type="button" disabled>
      继续批量采集
    </button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
