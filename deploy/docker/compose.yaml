name: bailian-studio-dev

services:
  bailian-studio-postgres-dev:
    image: postgres:16-alpine
    container_name: bailian-studio-postgres-dev
    ports:
      - "${BL_STUDIO_DEV_POSTGRES_PORT:-55431}:5432"
    environment:
      POSTGRES_USER: bailian-studio
      POSTGRES_PASSWORD: bailian-studio
      POSTGRES_DB: bailian-studio_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bailian-studio -d bailian-studio_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
    # Named volume: routine `docker compose down` keeps the dev schema/data.
    # Use `bun run db:reset` (or `down -v`) only when an intentional reset is needed.
    volumes:
      - bailian-studio-postgres-dev-data:/var/lib/postgresql/data

  # Development-only SMTP sink. It accepts mail without credentials and keeps
  # verification links out of application logs. Production must use a real
    # authenticated SMTP provider; see deploy/env/.env.example.
  bailian-studio-mailpit-dev:
    image: axllent/mailpit:v1.30.3
    container_name: bailian-studio-mailpit-dev
    ports:
      - "${BL_STUDIO_DEV_MAILPIT_SMTP_PORT:-11025}:1025"
      - "${BL_STUDIO_DEV_MAILPIT_UI_PORT:-18025}:8025"

volumes:
  bailian-studio-postgres-dev-data:
