# 生产栈编排（单机 Docker Compose，接入宿主机 nginx 边缘）。
#
# 用法：所有命令都带 `--env-file deploy/env/.env.prod`（服务器上为
# `$DEPLOY_REMOTE_DIR/deploy/env/.env.prod`）做变量插值；应用、基础设施和
# 备份参数统一来自这一个 gitignored 文件。
# 部署通过 `bun run deploy:prod`（scripts/deploy/deploy-prod.sh）完成。
#
# 边缘拓扑：HTTPS 由**宿主机 nginx** 终止（与 dev/lunar/p2p 等子域名同一套运维），
# 它把 create.yxswy.com 反代到 127.0.0.1:5002（web），logs.yxswy.com 反代到
# 127.0.0.1:5300（grafana）。本 compose 不再内置 Caddy。
#
# 观测栈（loki/alloy/grafana）放在 `observability` profile：默认 `up -d` 只启动
# 核心（postgres/migrate/api/worker/web/backup），上线稳定后再
# `bun run prod:observability:up` 启用日志采集。
name: bailian-studio-prod

# 公共日志轮转：json-file 驱动、单文件 20 MiB、最多 3 份，防止容器日志无限增长。
# 采集端（Alloy）从 docker 流式读取 stdout，轮转不丢失新行。
x-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# 静态 ffmpeg/ffprobe（宿主机自包含二进制，无共享库依赖，可跨发行版挂进 Debian 容器）。
# 运行时镜像不再打包 ffmpeg；api（上传媒体时长探测）与 worker（音频提取/缩略图）都依赖
# 这两个挂载。首次使用前先跑 scripts/dev/fetch-static-ffmpeg.sh（宿主机路径可经
# FFMPEG_HOST_DIR 覆盖，默认 /opt/bailian-studio/ffmpeg）。
x-ffmpeg-mounts: &ffmpeg-mounts
  - ${FFMPEG_HOST_DIR:-/opt/bailian-studio/ffmpeg}/ffmpeg:/usr/local/bin/ffmpeg:ro
  - ${FFMPEG_HOST_DIR:-/opt/bailian-studio/ffmpeg}/ffprobe:/usr/local/bin/ffprobe:ro

networks:
  # 业务后端：web → api → worker/postgres/migrate/backup
  backend:
  # 日志采集：alloy → loki → grafana
  logging:

volumes:
  postgres_data:
  loki_data:
  alloy_positions:
  grafana_data:
  backups:
  monitor_state:

services:
  # ── 数据库（容器化，命名卷持久化；如需外部托管库可把应用 DATABASE_URL 指向外部）──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # 2C2G 单机护栏：内存上限保证任一容器不会拖垮整栈；观测栈限额更紧，
    # 超限只重启自己（restart: unless-stopped），应用不受影响。
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *json-logging

  # 一次性迁移 job：drizzle-kit 幂等，重复执行会跳过已应用的迁移。
  migrate:
    image: bailian-studio-runtime:${BAILIAN_STUDIO_RELEASE_TAG:?BAILIAN_STUDIO_RELEASE_TAG must be a full Git commit SHA}
    pull_policy: never
    env_file:
      - ${BAILIAN_STUDIO_ENV_FILE:-../env/.env.prod}
    command: ["bun", "x", "drizzle-kit", "migrate", "--config", "packages/db/drizzle.config.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m
    networks: [backend]
    logging: *json-logging

  api:
    # API 与 Worker 必须运行同一份不可变镜像：worker 复用 api 的构建产物。
    image: bailian-studio-runtime:${BAILIAN_STUDIO_RELEASE_TAG:?BAILIAN_STUDIO_RELEASE_TAG must be a full Git commit SHA}
    pull_policy: never
    env_file:
      - ${BAILIAN_STUDIO_ENV_FILE:-../env/.env.prod}
    environment:
      # 生产强制 JSON-lines 日志，供 Alloy 按字段采集解析。
      LOG_FORMAT: json
      # ffprobe 来自静态挂载（见 x-ffmpeg-mounts）；显式指向，不依赖 PATH。
      FFPROBE_PATH: /usr/local/bin/ffprobe
    volumes: *ffmpeg-mounts
    command: ["bun", "apps/api/src/index.ts"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # 用 /live（进程存活）而非 /ready（含 worker 心跳）：worker 短暂降级不应阻止
    # 整个栈（web）启动；就绪态由部署冒烟独立检查。
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:5003/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend]
    labels:
      # Alloy 按该标签识别容器日志格式（json 字段流 / text 文本流）。
      bailian-studio.log-format: "json"
    logging: *json-logging
    mem_limit: 384m

  worker:
    # 注意：Worker 用 Node/tsx 启动（运行时约定，勿改用 bun）。
    image: bailian-studio-runtime:${BAILIAN_STUDIO_RELEASE_TAG:?BAILIAN_STUDIO_RELEASE_TAG must be a full Git commit SHA}
    pull_policy: never
    env_file:
      - ${BAILIAN_STUDIO_ENV_FILE:-../env/.env.prod}
    environment:
      LOG_FORMAT: json
      # 静态 ffmpeg/ffprobe 挂载路径（见 x-ffmpeg-mounts）；显式指向，不依赖 PATH。
      FFMPEG_PATH: /usr/local/bin/ffmpeg
      FFPROBE_PATH: /usr/local/bin/ffprobe
    volumes: *ffmpeg-mounts
    command: ["node", "--import", "tsx", "apps/worker/src/index.ts"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    labels:
      bailian-studio.log-format: "json"
    logging: *json-logging
    mem_limit: 384m

  web:
    # nginx 静态文件 + /api 反代（apps/studio 生产镜像）。只绑定 127.0.0.1，
    # 供宿主机 nginx 反代访问；不向公网暴露。
    image: bailian-studio-web:${BAILIAN_STUDIO_RELEASE_TAG:?BAILIAN_STUDIO_RELEASE_TAG must be a full Git commit SHA}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5002:5002"
    networks: [backend]
    labels:
      bailian-studio.log-format: "text"
    logging: *json-logging
    mem_limit: 128m

  # ── 每日备份：pg_dump | gzip 轮转（可选 OSS 上传）──
  backup:
    image: bailian-studio-backup:${BAILIAN_STUDIO_RELEASE_TAG:?BAILIAN_STUDIO_RELEASE_TAG must be a full Git commit SHA}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OSS_UPLOAD: ${BACKUP_OSS_UPLOAD:?BACKUP_OSS_UPLOAD required in .env.prod}
      BACKUP_OSS_DISABLED_ACK: ${BACKUP_OSS_DISABLED_ACK:-}
      BACKUP_OSS_PREFIX: ${BACKUP_OSS_PREFIX:-bailian-studio/backups}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
    volumes:
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if /usr/local/bin/backup-postgres.sh; then
            sleep 86400
          else
            echo "[backup] 备份失败（非零退出），5 分钟后重试" >&2
            sleep 300
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *json-logging

  # ── 观测栈（observability profile）：先核心后观测，默认不启动 ──
  loki:
    image: grafana/loki:3.6.12
    restart: unless-stopped
    # 仅绑定 localhost：供服务器上的 logs:prune 调 delete API 清理旧日志，
    # 不向公网暴露。
    ports:
      - "127.0.0.1:3100:3100"
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ../observability/loki/runtime-config.yaml:/etc/loki/runtime-config.yaml:ro
      - loki_data:/loki
    networks: [logging]
    logging: *json-logging
    mem_limit: 256m
    profiles: ["observability"]

  alloy:
    # 采集器用 Grafana Alloy（Promtail 已于 2026-03 EOL 的官方替代）。
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_positions:/var/lib/alloy
    depends_on:
      loki:
        condition: service_started
    networks: [logging]
    logging: *json-logging
    mem_limit: 128m
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:12.4.2
    restart: unless-stopped
    mem_limit: 192m
    # 只绑定 127.0.0.1:5300，宿主机 nginx 的 logs.yxswy.com 反代到这里。
    ports:
      - "127.0.0.1:5300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER required in .env.prod}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required in .env.prod}
      # 外部经宿主机 nginx 的 basic_auth 保护，Grafana 关闭匿名与自助注册。
      GF_SERVER_ROOT_URL: https://${LOGS_DOMAIN:?LOGS_DOMAIN required in .env.prod}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    networks: [logging]
    labels:
      bailian-studio.log-format: "text"
    logging: *json-logging
    profiles: ["observability"]

  # ── 生产 watchdog：容器/ready/备份/磁盘检查 + 可选 webhook 告警 ──
  monitor:
    image: docker:27.5.1-cli
    restart: unless-stopped
    mem_limit: 64m
    environment:
      MONITOR_PROJECT: bailian-studio-prod
      MONITOR_WEB_URL: http://web:5002
      MONITOR_STATE_FILE: /var/lib/bailian-monitor/last-state
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_BACKUP_MAX_AGE_HOURS: ${MONITOR_BACKUP_MAX_AGE_HOURS:-30}
      MONITOR_DISK_USED_PERCENT: ${MONITOR_DISK_USED_PERCENT:-85}
      MONITOR_ALERT_WEBHOOK_URL: ${MONITOR_ALERT_WEBHOOK_URL:-}
    command: ["/usr/local/bin/production-monitor.sh", "loop"]
    volumes:
      # watchdog 只调用 docker ps/inspect/exec；socket 本身仍是高权限能力，不能暴露到公网。
      - /var/run/docker.sock:/var/run/docker.sock
      # 只读宿主机挂载仅用于 df /host，脚本不读取宿主机文件内容。
      - /:/host:ro
      - monitor_state:/var/lib/bailian-monitor
      # 注意：此挂载路径依赖远端服务器的目录布局（$DEPLOY_REMOTE_DIR/deploy/scripts/），
      # 由 deploy-prod.sh 预先同步。本地直接运行 compose.prod.yaml 时此挂载会静默失效。
      - ../scripts/production-monitor.sh:/usr/local/bin/production-monitor.sh:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [backend]
    labels:
      bailian-studio.log-format: "text"
    logging: *json-logging
    profiles: ["observability"]
