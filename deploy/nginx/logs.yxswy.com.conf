# logs.yxswy.com —— bailian-studio 日志查看入口（Grafana）。
# 宿主机 nginx 边缘模板。basic_auth 密码文件由 setup-host-edge.sh 从
# .env.prod-infra 的 GRAFANA_ADMIN_PASSWORD 生成（/etc/nginx/htpasswd.bailian-logs）。

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name logs.yxswy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bailian-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS proxy（basic_auth 保护） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logs.yxswy.com;

    # 注意：certbot 一次签发覆盖两个域名的 SAN 证书，只存在 live/create.yxswy.com/ 下；
    # 两个站点共用同一份证书路径。
    ssl_certificate     /etc/letsencrypt/live/create.yxswy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/create.yxswy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "Bailian Studio Logs";
    auth_basic_user_file /etc/nginx/htpasswd.bailian-logs;

    location / {
        proxy_pass http://127.0.0.1:5300;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 5m;
    }
}
