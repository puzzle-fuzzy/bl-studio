# 推送/PR 时跑完整 verify 门禁：baseline + 包边界 + manifests + typecheck + 全仓测试。
# 用 GitHub Actions 的 postgres service 充当 test DB（共享测试库 :55432）。
# 生产部署仍在本地执行（deploy:prod / deploy:prod:web），CI 只做质量门禁。
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bailian-studio
          POSTGRES_PASSWORD: bailian-studio
          POSTGRES_DB: bailian-studio_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bailian-studio"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bailian-studio:bailian-studio@127.0.0.1:55432/bailian-studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 用 migrate（而非 push）准备 test DB：生产只走 migrate，CI 必须覆盖同一条路径；
      # schema↔迁移链一致性由 verify 里的 check:db-migrations（drizzle-kit generate 离线对账）把关。
      - run: pnpm run db:migrate:test
      - run: pnpm run verify

  # e2e 资产闭环（独立 job，各自的服务容器互不干扰）。与 verify 走同一条 migrate 路径，
  # 再直接跑 Playwright——刻意不用 `pnpm run e2e`（其内部 db:push 会掩盖迁移漂移，CI 只允许 migrate）。
  # API 由 playwright.config.ts 的 webServer 用 bun 启动；asset-loop.spec.ts 是纯 API 驱动（request fixture，
  # 不需要浏览器二进制），install chromium 仅为未来浏览器 spec 兜底。
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bailian-studio
          POSTGRES_PASSWORD: bailian-studio
          POSTGRES_DB: bailian-studio_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bailian-studio"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bailian-studio:bailian-studio@127.0.0.1:55432/bailian-studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate:test
      - run: node infra/scripts/playwright-cli.cjs install --with-deps chromium
      - run: node infra/scripts/playwright-cli.cjs test --config=e2e/playwright.config.ts
